name: ":question: Question"
description: Ask questions.
title: "[Question]: "
labels: ["question"]
assignees: ["WasiqB"]
body:
  - type: textarea
    id: question
    attributes:
      label: Describe your question with as much detail as possible
      description: |
        A clear and concise question that doesn't require too much conversation.
        Need more help? [Find me on Gitter](https://gitter.im/WasiqB/multiple-cucumber-html-reporter-plugin)
      placeholder: |
        **If it's about a specific piece of code, try and include some of it to support your question.**
        [...]
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Environment (please complete the following information)

  - type: input
    id: reporter-version
    attributes:
      label: multiple-cucumber-html-reporter
      description: The version of multiple-cucumber-html-reporter you are using
      placeholder: e.g. 1.10.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 8.9.1
    validations:
      required: true

  - type: input
    id: npm-version
    attributes:
      label: NPM version
      placeholder: e.g. 5.8.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform name and version
      placeholder: e.g. Windows 10
    validations:
      required: true

  - type: input
    id: cucumber-version
    attributes:
      label: Cucumber version
      placeholder: e.g. 4.2.0
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
