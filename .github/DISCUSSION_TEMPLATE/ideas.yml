title: "[Idea] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## Share your idea
        Thanks for helping improve the project! Please describe your idea clearly and search existing discussions before posting.

  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: A clear and concise description of your idea.
      placeholder: I'd like to see...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Explain the problem, pain point, or use case this idea addresses.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Add any other context, screenshots, or links here.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing discussions and this idea has not already been posted.
          required: true
