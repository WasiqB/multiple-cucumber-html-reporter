name: Test Cypress Example

on:
  push:
    branches:
      - main
    paths:
      - examples/cypress/**
      - reporter/**

  pull_request:
    branches:
      - main
    paths:
      - examples/cypress/**
      - reporter/**

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        message-format: [messages, json]

    runs-on: ${{ matrix.os }}

    env:
      MESSAGES: ${{ matrix.message-format }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        working-directory: reporter
        run: pnpm build

      - name: Install Cypress Binary
        working-directory: examples/cypress
        run: pnpm cypress install

      - name: Run Cypress Tests
        working-directory: examples/cypress
        run: pnpm test
        continue-on-error: true

      - name: Link the CLI Globally
        run: pnpm add --global ./reporter

      - name: Sanity check CLI command
        working-directory: examples/cypress
        run: mchr --version

      - name: Generate Report with ND-JSON files
        if: ${{ matrix.message-format == 'messages' }}
        working-directory: examples/cypress
        run: pnpm report -m

      - name: Generate Report with Legacy JSON files
        if: ${{ matrix.message-format == 'json' }}
        working-directory: examples/cypress
        run: pnpm report

      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          name: cypress-report-${{ matrix.os }}-${{ matrix.message-format }}
          path: examples/cypress/.run/html-report
