name: Release to NPM and GitHub

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release Type"
        required: true
        type: choice
        options:
          - "major"
          - "minor"
          - "patch"
        default: "patch"
      pre-release:
        description: Is this a pre-release?
        type: boolean
        default: false

env:
  GITHUB_AUTH: ${{ secrets.PUSH_TOKEN }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Cache Build
        id: build-cache
        uses: actions/cache@v6
        with:
          path: reporter/dist
          key: mchr-${{ runner.os }}-${{ github.run_id }}-${{ github.run_number }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Root Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm build
        working-directory: reporter

  dry-run:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore cached Build
        id: cache-build-restore
        uses: actions/cache/restore@v6
        with:
          path: reporter/dist
          key: mchr-${{ runner.os }}-${{ github.run_id }}-${{ github.run_number }}

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Release
        if: ${{ ! inputs.pre-release }}
        run: pnpm release.${{ github.event.inputs.release-type }} --dry-run

      - name: Pre Release
        if: ${{ inputs.pre-release }}
        run: pnpm release.pre${{ github.event.inputs.release-type }} --dry-run

  release:
    runs-on: ubuntu-latest
    needs: dry-run

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.PUSH_TOKEN }}

      - name: Restore cached Build
        id: cache-build-restore
        uses: actions/cache/restore@v6
        with:
          path: reporter/dist
          key: mchr-${{ runner.os }}-${{ github.run_id }}-${{ github.run_number }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Root Dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade NPM
        run: |
          npm install -g npm
          npm -v

      - name: Release
        if: ${{ ! inputs.pre-release }}
        run: pnpm release.${{ github.event.inputs.release-type }}

      - name: Pre Release
        if: ${{ inputs.pre-release }}
        run: pnpm release.pre${{ github.event.inputs.release-type }}
