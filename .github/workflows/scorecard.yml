---
# This workflow uses actions that are not certified by GitHub. They are
# provided by a third-party and are governed by separate terms of
# service, privacy policy, and support documentation.
#
# Official public-repo example from ossf/scorecard-action:
# https://github.com/ossf/scorecard-action/blob/main/examples/scorecard.yml

name: "Scorecard supply-chain security"

on:
  branch_protection_rule:
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  analysis:
    name: "Scorecard analysis"
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          fail_on_publish_error: true

      - name: "Upload artifact"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code scanning"
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
