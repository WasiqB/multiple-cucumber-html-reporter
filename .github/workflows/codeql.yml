name: CodeQL Scannings

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - java
          - typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        if: ${{ matrix.language == 'java' }}
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Auto build typescript
        if: ${{ matrix.language == 'typescript' }}
        uses: github/codeql-action/autobuild@v4.38.2

      - name: Build Java Project
        if: ${{ matrix.language == 'java' }}
        run: mvn install -DskipTests
        working-directory: examples/selenium

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
